<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Other Events</title>
    <link rel="stylesheet" href="admin_site.css">
    <!-- <script src="script.js"></script> -->
  </head>
  <body>
    <h1>Other Events</h1>
    <div class="container">
      <a class="button" href='admin_homepage.html'><span>Homepage</span></a>
      <div class="page-content">
        <h1>Event Details</h1>
        <form>
          <label for="event name">Event Name:</label>
          <input type="text" id="event name" name="event name"></input>
          <label for="event type">Event Type:</label>
          <input type="text" id="event type" name="event type"></input>
          <label for="event date">Event Date:</label>
          <input type="text" id="event date" name="event date"></input>
          <label for="event start time">Start Time:</label>
          <input type="text" id="event start time" name="event start time"></input>
          <label for="event duration">Duration:</label>
          <input type="text" id="event duration" name="event duration"></input>
          <label for="event meeting point">Location:</label>
          <input type="text" id="event meeting point" name="event meeting point"></input>
        </form>
        <section>
          <button class="large-button">Create New Event</button>
        </section>
      </div>
      <div class="page-listings">
        <div class="listing">
          <h4>Event Name 1</h4>
          <p>Event Type 1</p>
          <p>Event Date 1</p>

          <button>Delete</button>

        <div class="listing">

      </div>
    </div>
