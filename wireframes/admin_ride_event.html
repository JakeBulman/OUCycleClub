<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ride Events</title>
    <link rel="stylesheet" href="admin_site.css">
    <!-- <script src="script.js"></script> -->
  </head>
  <body>
    <h1>Ride Events</h1>
    <div class="container">
      <a class="button" href='admin_homepage.html'><span>Homepage</span></a>
      <a class="button" href='admin_ride_events.html'><span>Ride Events</span></a>
      <div class="page-content">
        <h1>Ride Details</h1>
        <form>
          <label for="ride name">Name of Ride:</label>
          <input type="text" id="ride name" name="ride name"></input>
          <label for="ride type">Type of Ride:</label>
          <input type="text" id="ride type" name="ride type"></input>
          <label for="ride date">Date of Ride:</label>
          <input type="text" id="ride date" name="ride date"></input>
          <label for="ride start time">Start Time:</label>
          <input type="text" id="ride start time" name="ride start time"></input>
          <label for="ride duration">Duration:</label>
          <input type="text" id="ride duration" name="ride duration"></input>
          <label for="ride meeting point">Meeting Point:</label>
          <input type="text" id="ride meeting point" name="ride meeting point"></input>
          <label for="ride distance">Distance in km:</label>
          <input type="text" id="ride distance" name="ride distance"></input>
          <label for="ride elevation">Elevation in m:</label>
          <input type="text" id="ride elevation" name="ride elevation"></input>
          <label for="ride size">Maximum Group Size:</label>
          <input type="text" id="ride size" name="ride size"></input>
          <label for="ride leader">Name of Leader:</label>
          <input type="text" id="ride leader" name="ride leader"></input>
          <label for="ride contact">Contact Number:</label>
          <input type="text" id="ride contact" name="ride contact"></input>
          <label for="ride contact2">Alternative Contact Number:</label>
          <input type="text" id="ride contact2" name="ride contact2"></input>
          <label for="ride comments">Comments:</label>
          <input type="text" id="ride comments" name="ride comments"></input>
          <label for="ride status">Status:</label>
          <input disabled type="text" id="ride status" name="ride status" value="Proposed"></input>
        </form>
        <section>
          <button class="large-button">Save Edits</button>
        </section>
        <section>
          <button class="large-button">Approve Ride</button>
        </section>
        <section >
          <button class="large-button">Reject Ride</button>
        </section>
      </div>
    </div>
  </body>
</html>
